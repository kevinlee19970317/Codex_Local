<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>运营核心指标看板</title>
  <style>
    :root { --bg:#f7f8f5; --panel:#ffffff; --ink:#1f272a; --muted:#6d777a; --line:#dfe5df; --green:#16845b; --blue:#315f8c; --amber:#a86618; --rose:#b04444; --primary:#176b5b; --soft:#edf2ee; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Arial, 'Microsoft YaHei', sans-serif; background:var(--bg); color:var(--ink); }
    .wrap { max-width: 1440px; margin: 0 auto; padding: 28px; }
    header { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:22px; }
    h1 { margin:0 0 8px; font-size:30px; letter-spacing:0; }
    .sub { color:var(--muted); font-size:14px; }
    .source { text-align:right; color:var(--muted); font-size:13px; line-height:1.7; }
    .topActions { display:flex; align-items:flex-end; gap:12px; }
    .iconBtn { border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:6px; height:34px; padding:0 12px; font:inherit; font-size:13px; cursor:pointer; }
    .iconBtn:hover { border-color:#b8c4bb; background:#fbfcfb; }
    .iconBtn.primary { background:var(--ink); border-color:var(--ink); color:#fff; }
    .insights { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; margin:0 0 16px; }
    .insightsHead { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:12px; }
    .insightsHead h2 { font-size:18px; }
    .insightGrid { display:grid; grid-template-columns: 1.1fr 1fr 1fr; gap:14px; }
    .insightBlock { border-left:3px solid var(--primary); padding-left:12px; min-height:84px; }
    .insightBlock.risk { border-color:var(--rose); }
    .insightBlock.action { border-color:var(--blue); }
    .insightTitle { font-size:13px; color:var(--muted); margin-bottom:6px; }
    .insightMain { font-size:20px; font-weight:700; margin-bottom:6px; }
    .insightBlock ul { margin:0; padding-left:16px; color:var(--ink); font-size:13px; line-height:1.7; }
    .insightBlock li { margin:0; }
    .cards { display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap:14px; margin-bottom:16px; }
    .metric { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; min-height:142px; }
    .metric.wide { grid-column: span 2; min-height:248px; padding:18px 22px; }
    .metric .label { color:var(--muted); font-size:14px; margin-bottom:8px; }
    .metric .value { font-size:28px; font-weight:700; margin-bottom:10px; white-space:nowrap; }
    .metric.wide .value { font-size:34px; }
    .metric .row { display:flex; justify-content:space-between; gap:10px; font-size:13px; padding-top:8px; border-top:1px solid var(--line); color:var(--muted); }
    .gauge { position:relative; height:148px; max-width:500px; margin:8px auto 12px; }
    .metric.wide .gauge { height:152px; }
    .gauge svg { width:100%; height:100%; overflow:visible; }
    .gaugeTrack { fill:none; stroke:#e5e8e5; stroke-width:16; stroke-linecap:round; }
    .gaugeFill { fill:none; stroke-width:16; stroke-linecap:round; }
    .gaugeKnob { fill:#fff; stroke-width:4; }
    .gaugeCenter { position:absolute; left:16px; right:16px; bottom:6px; text-align:center; line-height:1.28; pointer-events:none; }
    .metric.wide .gaugeCenter { bottom:6px; }
    .gaugeValue { font-size:24px; font-weight:700; white-space:nowrap; }
    .metric.wide .gaugeValue { font-size:26px; }
    .gaugeMeta { margin-top:4px; color:var(--ink); font-size:11px; }
    .gaugeMeta span { color:var(--muted); }
    .targetLine { padding-top:8px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; }
    .targetText { display:flex; justify-content:space-between; gap:8px; margin-bottom:5px; }
    .targetBar { height:5px; background:var(--soft); border-radius:999px; overflow:hidden; }
    .targetFill { height:100%; border-radius:999px; }
    .delta { font-weight:700; }
    .up { color:var(--green); } .down { color:var(--rose); } .flat { color:var(--muted); }
    .grid { display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:16px; }
    .filters { display:flex; align-items:center; justify-content:space-between; gap:14px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin:0 0 16px; }
    .filterGroup { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .filterGroup label { color:var(--muted); font-size:13px; }
    .filterGroup select { height:34px; min-width:132px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); padding:0 10px; font:inherit; font-size:13px; }
    .filterHint { color:var(--muted); font-size:12px; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; min-height:360px; }
    .panelHead { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; }
    h2 { margin:0; font-size:18px; }
    .note { color:var(--muted); font-size:12px; }
    svg { width:100%; height:260px; display:block; overflow:visible; }
    .axis { stroke:#cfd8d1; stroke-width:1.2; }
    .tick { fill:var(--muted); font-size:11px; }
    .line { fill:none; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
    .hoverBand { fill: transparent; pointer-events: all; }
    .legend { display:flex; flex-wrap:wrap; justify-content:center; gap:8px 12px; margin-top:8px; color:var(--muted); font-size:11px; }
    .legend span { display:inline-flex; align-items:center; gap:5px; }
    .legend i { width:10px; height:3px; border-radius:2px; display:inline-block; }
    .chartControl { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; }
    .chartControl select { height:30px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); padding:0 8px; font:inherit; font-size:12px; }
    .tooltip { position:fixed; z-index:10; max-width:260px; pointer-events:none; background:var(--ink); color:#fff; border-radius:6px; padding:8px 10px; font-size:12px; line-height:1.6; box-shadow:0 10px 28px rgba(29,37,40,.22); opacity:0; transform:translate(10px, 10px); white-space:pre-line; }
    .modalMask { position:fixed; inset:0; background:rgba(29,37,40,.28); display:none; align-items:center; justify-content:center; z-index:20; padding:20px; }
    .modal { width:min(980px, 96vw); max-height:86vh; overflow:auto; background:#fff; border-radius:8px; border:1px solid var(--line); box-shadow:0 18px 60px rgba(29,37,40,.24); padding:18px; }
    .modalHead { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
    .targetGrid { display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:10px 14px; }
    .targetItem { display:grid; grid-template-columns: 1fr 150px; align-items:center; gap:10px; border-bottom:1px solid #edf0ed; padding:8px 0; }
    .targetItem label { color:var(--ink); font-size:13px; }
    .targetItem input { height:32px; border:1px solid var(--line); border-radius:6px; padding:0 9px; font:inherit; font-size:13px; text-align:right; }
    .modalFoot { display:flex; justify-content:flex-end; gap:10px; margin-top:14px; }
    @media (max-width: 980px) { .cards, .grid, .targetGrid, .insightGrid { grid-template-columns:1fr; } .metric.wide { grid-column:auto; } .filters { display:block; } .filterHint { margin-top:8px; } header { display:block; } .topActions { align-items:flex-start; margin-top:12px; } .source { text-align:left; } .wrap { padding:18px; } .targetItem { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>运营核心指标看板</h1>
        <div class="sub">近 15 天趋势 · 本月 vs 上月 · 数据源 Sheet：明细数据</div>
      </div>
      <div class="topActions">
        <button class="iconBtn" onclick="openTargets()">目标设置</button>
        <div class="source">源文件：明细数据v2_260514.xlsx<br/>数据最新日期：<span id="latest"></span></div>
      </div>
    </header>
    <section class="insights" id="insights"></section>
    <section class="cards" id="cards"></section>
    <section class="filters">
      <div class="filterGroup">
        <label for="loanTypeFilter">首复贷</label>
        <select id="loanTypeFilter"></select>
        <label for="appGroupFilter">APP分组</label>
        <select id="appGroupFilter"></select>
      </div>
      <div class="filterHint" id="filterHint"></div>
    </section>
    <section class="grid" id="charts"></section>
    <div class="tooltip" id="tooltip"></div>
    <div class="modalMask" id="targetModal" onclick="closeTargets(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modalHead">
          <h2>本月目标设置</h2>
          <button class="iconBtn" onclick="closeTargets()">关闭</button>
        </div>
        <div class="filterHint">输入本月整月目标；累计类指标会按数据最新日期折算为同期目标，效率类指标直接对比目标。</div>
        <div class="targetGrid" id="targetInputs"></div>
        <div class="modalFoot">
          <button class="iconBtn" onclick="clearTargets()">清空目标</button>
          <button class="iconBtn" onclick="saveTargets()">保存</button>
          <button class="iconBtn primary" onclick="exportTargetHtml()">导出带目标版本</button>
        </div>
      </div>
    </div>
  </div>

function monthlyValue(rows, metric) {
  if (!rows.length) return 0;
  if (metric.monthly === 'avg') return sum(rows, metric.key) / rows.filter(r => Number.isFinite(+r[metric.key])).length;
  if (metric.monthly === 'weightedCps') return sum(rows, 'firstSpend') / Math.max(sum(rows, 'firstLoans'), 1);
  if (metric.monthly === 'weightedCpa') return sum(rows, 'firstSpend') / Math.max(sum(rows, 'firstApps'), 1);
  if (metric.monthly === 'feeRatio') {
    const cps = sum(rows, 'firstSpend') / Math.max(sum(rows, 'firstLoans'), 1);
    const firstAvg = sum(rows, 'firstAmount') / Math.max(sum(rows, 'firstLoans'), 1);
    return firstAvg ? cps / firstAvg : 0;
  }
  if (metric.monthly === 'firstTicket') return sum(rows, 'firstAmount') / Math.max(sum(rows, 'firstLoans'), 1);
  if (metric.monthly === 'repeatTicket') return sum(rows, 'repeatAmount') / Math.max(sum(rows, 'repeatLoans'), 1);
  if (metric.monthly === 'firstPassRate') return sum(rows, 'firstApprovalPassed') / Math.max(sum(rows, 'firstApprovalBase'), 1);
  if (metric.monthly === 'repeatPassRate') return sum(rows, 'repeatApprovalPassed') / Math.max(sum(rows, 'repeatApprovalBase'), 1);

    return `<path class="line" stroke="${s.color || metric.color}" d="${smoothPath(points)}"><title>${s.name} · ${metric.name}</title></path>`;
  }).join('');
  const hoverWidth = (w-l-r) / Math.max(dates.length, 1);
  const hoverBands = dates.map((date, i) => {
    const lines = activeSeries.map(s => `${s.name}: ${withUnit(fmt(+((s.last15[i] || {})[metric.key]) || 0, metric), metric)}`).join('\n');
    return `<rect class="hoverBand" x="${x(i)-hoverWidth/2}" y="${t}" width="${hoverWidth}" height="${h-t-b}" data-tip="${escAttr(`${date}\n${lines}`)}" onmousemove="showTip(event, this.dataset.tip)" onmouseleave="hideTip()"></rect>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${metric.name}近15天趋势">
    <line class="axis" x1="${l}" x2="${l}" y1="${t}" y2="${h-b}"/>
    <line class="axis" x1="${l}" x2="${w-r}" y1="${h-b}" y2="${h-b}"/>
    ${ticks.map(v => `<text class="tick" x="8" y="${y(v)+4}">${fmtAxis(v)}</text>`).join('')}
    ${paths}
    ${hoverBands}
    ${chartLast15.map((d,i) => i%2===0 || i===chartLast15.length-1 ? `<text class="tick" x="${x(i)}" y="${h-14}" text-anchor="middle">${shortDate(d.date)}</text>` : '').join('')}
  </svg>`;
}
function smoothPath(points) {
  if (!points.length) return '';
  if (points.length === 1) return `M ${points[0].x} ${points[0].y}`;
  let d = `M ${points[0].x} ${points[0].y}`;
  for (let i = 0; i < points.length - 1; i++) {
    const current = points[i];
    const next = points[i + 1];
    const previous = points[i - 1] || current;
    const following = points[i + 2] || next;
    const cp1x = current.x + (next.x - previous.x) / 6;
    const cp1y = current.y + (next.y - previous.y) / 6;
    const cp2x = next.x - (following.x - current.x) / 6;
    const cp2y = next.y - (following.y - current.y) / 6;
    d += ` C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${next.x} ${next.y}`;
  }
  return d;
}
function barCompare(metric, splitBy) {
  if (splitBy !== 'none') return seriesBarCompare(metric, splitBy);
  const compareRows = metric.key === 'spend' ? chartLastMonth : chartLastMonthSamePeriod;
  const now = monthlyValue(chartThisMonth, metric), old = monthlyValue(compareRows, metric);
  const max = Math.max(now, old, 1);
  const rows = [
    {name: metric.key === 'spend' ? '上月' : '上月同期', value:old, color:'#a9b2ad'},
    {name: metric.key === 'spend' ? '本月' : '本月同期', value:now, color:metric.color}
  ];
  return `<div style="display:grid; gap:12px; margin-top:4px;">
    ${rows.map(row => `<div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:5px;"><span>${row.name}</span><strong>${fmt(row.value, metric)} ${metric.unit}</strong></div>
      <div style="height:12px;background:var(--soft);border-radius:6px;overflow:hidden;"><div style="width:${Math.max(row.value/max*100,1)}%;height:100%;background:${row.color};border-radius:6px;"></div></div>
    </div>`).join('')}
  </div>`;
}
function seriesBarCompare(metric, splitBy) {
  const result = seriesForSplit(splitBy);
  const oldLabel = metric.key === 'spend' ? '上月' : '上月同期';
  const nowLabel = metric.key === 'spend' ? '本月' : '本月同期';
  const groups = result.series.map(s => {
    const rows = normalizeRows(s.rows);
    const nowRows = rows.filter(d => d.dt.getFullYear()===curYear && d.dt.getMonth()===curMonth);
    const prevRows = rows.filter(d => d.dt.getFullYear()===prev.getFullYear() && d.dt.getMonth()===prev.getMonth());
    const compareRows = metric.key === 'spend' ? prevRows : prevRows.filter(d => d.dt.getDate() <= latest.getDate());
    return {name:s.name, color:s.color, now:monthlyValue(nowRows, metric), old:monthlyValue(compareRows, metric)};
  }).filter(g => g.now || g.old);
  const max = Math.max(...groups.flatMap(g => [g.now, g.old]), 1);
  return `<div style="display:grid; gap:12px; margin-top:4px;">
    ${groups.map(g => `<div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:5px;"><span>${g.name}</span><span><strong>${oldLabel}：</strong>${fmt(g.old, metric)} ${metric.unit} &nbsp; <strong>${nowLabel}：</strong>${fmt(g.now, metric)} ${metric.unit}</span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">
        <div title="上月${metric.key === 'spend' ? '' : '同期'}"><div style="height:10px;background:var(--soft);border-radius:6px;overflow:hidden;"><div style="width:${Math.max(g.old/max*100,1)}%;height:100%;background:#a9b2ad;border-radius:6px;"></div></div></div>
        <div title="本月${metric.key === 'spend' ? '' : '同期'}"><div style="height:10px;background:var(--soft);border-radius:6px;overflow:hidden;"><div style="width:${Math.max(g.now/max*100,1)}%;height:100%;background:${g.color};border-radius:6px;"></div></div></div>
      </div>
    </div>`).join('')}
  </div>`;
}
function makeCharts() {
  const charts = document.getElementById('charts');
  charts.innerHTML = trendMetrics.map(m => {
    const splitBy = metricSplits[m.key] || 'none';
    const localSeries = splitBy === 'none' ? [] : seriesForSplit(splitBy).series;
    return `<article class="panel">
    <div class="panelHead"><h2>${m.name}</h2><div class="chartControl"><span>拆分</span><select onchange="setMetricSplit('${m.key}', this.value)"><option value="none" ${splitBy==='none'?'selected':''}>不拆分</option><option value="loanType" ${splitBy==='loanType'?'selected':''}>按首复贷</option><option value="appGroup" ${splitBy==='appGroup'?'selected':''}>按APP分组</option></select></div></div>
    ${lineChart(m, splitBy)}
    ${localSeries.length > 1 ? `<div class="legend">${localSeries.map(s => `<span><i style="background:${s.color}"></i>${s.name}</span>`).join('')}</div>` : ''}
    <div class="panelHead" style="margin-top:4px"><h2 style="font-size:15px">${m.key === 'spend' ? '本月 vs 上月' : '本月同期 vs 上月同期'}</h2><span class="note">${m.monthly === 'avg' ? '按日均' : m.key==='cps' ? '同期按投放/放款加权' : '同期累计'}</span></div>
    ${barCompare(m, splitBy)}
  </article>`;
  }).join('');
}
makeInsights(); makeCards(); initFilters();
</script>
